# Offline (unified) pseudo-quant — align with historical ASDQ W4 tables (ratio=0.01 → ~0.66 RWQA)
model: llava_onevision
model_args: "pretrained=lmms-lab/llava-onevision-qwen2-7b-ov"
batch_size: "1"
device: null

calib_data: coco
n_samples: 128
data_path: "/root/autodl-tmp/hf_home/datasets/coco/sharegpt4v_coco_only.json"
image_folder: "/root/autodl-tmp/hf_home/datasets"
interleave_format: false
few_shot_format: false
text_data_path: ""

asd_theta1: 0.8
asd_theta2: 0.2
asd_normalize: true
asd_mixed_precision: true
# Match ASDQ table keep-ratio (not target_bit=4.01 which is r≈0.0008)
target_bit: null
asd_high_precision_ratio: 0.01
asd_high_bit: 16.0
asd_low_w_bit: 4

run_process: true
scale_path: "experiments/offline_vs_sequential/scale_cache/prism_offline.pt"
w_bit: 4
w_group: 128
pseudo_quant: true
quant_mode: offline
mse_epochs: 0
mse_lr: 1.0e-5

tasks: "realworldqa"
limit: null
output_path: "experiments/offline_vs_sequential/results/offline"
seed: "0,1234,1234,1234"
gen_kwargs: ""
log_samples: false
verbosity: "INFO"
